# SSH Server Configuration - OTGW Logger
# Install to: /etc/ssh/sshd_config.d/ethernet-only.conf
#
# Security: SSH is restricted to ethernet only via iptables rules.
# The firewall blocks port 22 on all wlan* interfaces, so WiFi SSH
# connections are rejected. This requires physical ethernet access.
#
# Default credentials:
#   Username: otgw
#   Password: otgw
#
# Change your password after first login: passwd

# Listen on all interfaces (iptables handles the restriction)
ListenAddress 0.0.0.0

# Security settings
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
# Each key in ~/.ssh/ and the SSH agent counts as one attempt.
# Set high enough that a user with several keys can still reach password auth.
# Low risk: SSH is ethernet-only so brute-force from the network is not a concern.
MaxAuthTries 10
LoginGraceTime 60

# Disable unused authentication methods
KbdInteractiveAuthentication no
KerberosAuthentication no
GSSAPIAuthentication no

# Login banner (shown before authentication)
Banner /etc/ssh/otgw_banner
