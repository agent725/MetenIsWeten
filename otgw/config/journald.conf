# Systemd Journal Configuration for OTGW Logger
# Install to: /etc/systemd/journald.conf.d/otgw.conf
#
# Purpose: Reduce SD card writes by limiting journal size and using volatile storage

[Journal]
# Use volatile storage (RAM) instead of persistent storage
# Journal is lost on reboot, but SD card is protected
Storage=volatile

# Maximum size of journal in RAM (default is 10% of RAM)
RuntimeMaxUse=50M

# Maximum size of individual journal files
RuntimeMaxFileSize=10M

# Keep journal entries for max 1 day (we sync logs to VPS anyway)
MaxRetentionSec=1day

# Compress journal entries to save space
Compress=yes

# Rate limiting to prevent log spam from filling RAM
RateLimitIntervalSec=30s
RateLimitBurst=1000

# Forward to syslog is disabled (reduces writes)
ForwardToSyslog=no

# Forward to console for debugging (optional)
ForwardToConsole=no
