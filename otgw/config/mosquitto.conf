# Mosquitto MQTT Broker Configuration for OTGW Logger
# Install to: /etc/mosquitto/conf.d/otgw.conf

# Listen on all interfaces (localhost + WiFi for P1 dongle)
listener 1883 0.0.0.0

# Allow anonymous connections (local network only)
allow_anonymous true

# Reduce logging to minimize SD card writes
# Options: debug, error, warning, notice, information, none
log_type error
log_type warning

# Don't log to file (use systemd journal instead)
log_dest stderr

# Disable persistence to reduce SD card writes
# Messages are transient - if broker restarts, no retained messages
persistence false

# Connection settings
max_connections -1
max_keepalive 120

# Message size limit (P1 and OTGW messages are small)
message_size_limit 10240
